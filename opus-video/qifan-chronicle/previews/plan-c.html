<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>方案C 一张地图走完二十年</title>
<link rel="stylesheet" href="../../../node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource/ma-shan-zheng/400.css">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1210; }
  canvas { display: block; }
  #ui { position: absolute; left: 80px; top: 70px; color: #f6ead2; font: 700 28px "Noto Sans SC"; letter-spacing: 8px; }
  #ui b { display: block; margin-top: 10px; font: 400 64px "Ma Shan Zheng"; letter-spacing: 4px; color: #ffd37a; }
</style>
<script type="importmap">{ "imports": { "three": "../../../node_modules/three/build/three.module.js" } }</script>
</head><body>
<div id="ui">一张地图 · 走完二十年<b>蜀营 → 魏营</b></div>
<script type="module">
import * as THREE from 'three';
window.ready = false;
await document.fonts.load('900 80px "Noto Serif SC"', '0123456789巅峰同时在线万三国争霸群雄逐鹿冠军联赛奖金元');
await document.fonts.load('400 80px "Ma Shan Zheng"', '蜀魏营地图走完二十年');
await document.fonts.ready;

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1a14');
scene.fog = new THREE.Fog('#4a2c1c', 25, 95);
const camera = new THREE.PerspectiveCamera(55, W / H, .1, 400);
// 天空：落日渐变
scene.background = (() => { const cv = document.createElement('canvas'); cv.width = 2; cv.height = 256; const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#120c14'); g.addColorStop(.55, '#5a2a1c'); g.addColorStop(.8, '#d9763a'); g.addColorStop(1, '#4a2c1c');
  c.fillStyle = g; c.fillRect(0, 0, 2, 256); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t; })();

// 光：落日暖光 + 冷色天光
scene.add(new THREE.HemisphereLight('#ffd9a8', '#1c2440', .9));
const sun = new THREE.DirectionalLight('#ffb36b', 2.4); sun.position.set(-40, 30, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70 });
scene.add(sun);

// 地图：100×100，蜀营在 (-40,40)（左下），魏营在 (40,-40)（右上）
const N = 100;
const ground = new THREE.PlaneGeometry(N, N, 120, 120); ground.rotateX(-Math.PI / 2);
const pos = ground.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const river = Math.abs(x - z) / Math.SQRT2;              // 到大河（左上→右下对角线）的距离
  const mid = Math.abs(x + z) / Math.SQRT2;                // 到中路的距离
  let h = 1.6 * Math.sin(x * .21) * Math.cos(z * .17) + .8 * Math.sin(x * .5 + z * .3);
  h *= Math.min(1, Math.max(0, mid - 3) / 8);              // 中路压平
  h -= Math.max(0, 4 - river) * .9;                        // 河床下陷
  pos.setY(i, h);
}
ground.computeVertexNormals();
scene.add(Object.assign(new THREE.Mesh(ground, new THREE.MeshStandardMaterial({ color: '#4f6b3a', roughness: .95, flatShading: true })), { receiveShadow: true }));
const water = new THREE.Mesh(new THREE.PlaneGeometry(150, 7), new THREE.MeshStandardMaterial({ color: '#3d78b8', roughness: .2, metalness: .3, transparent: true, opacity: .85 }));
water.geometry.rotateX(-Math.PI / 2); water.rotation.y = -Math.PI / 4; water.position.y = -1.2; scene.add(water);  // 沿 (1,0,1)

// 中路：一条金色石板路
const path = new THREE.Mesh(new THREE.PlaneGeometry(4, 120), new THREE.MeshStandardMaterial({ color: '#c9a35a', roughness: .8 }));
path.geometry.rotateX(-Math.PI / 2); path.rotation.y = -Math.PI / 4; path.position.y = .45; scene.add(path);   // 沿 (1,0,-1)

// 营寨
function camp(x, z, color, glyph) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(5, 6, 3, 8), new THREE.MeshStandardMaterial({ color: '#6b5440', flatShading: true }));
  base.position.y = 1.5; base.castShadow = true; g.add(base);
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3, 8, 8), new THREE.MeshStandardMaterial({ color, flatShading: true }));
  tower.position.y = 7; tower.castShadow = true; g.add(tower);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(4, 4, 8), new THREE.MeshStandardMaterial({ color: '#2b1d16', flatShading: true }));
  roof.position.y = 13; g.add(roof);
  const label = sprite(glyph, color, 256, 256); label.position.set(0, 19, 0); g.add(label);
  g.position.set(x, 0, z); scene.add(g);
}

// 文字贴图
function tex(draw, w, h) { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function sprite(text, color, w, h) {
  const t = tex((c) => { c.font = '400 200px "Ma Shan Zheng"'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.shadowColor = color; c.shadowBlur = 30; c.fillText(text, w / 2, h / 2 + 10); }, w, h);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false })); s.scale.set(6, 6, 1); return s;
}
camp(-40, 40, '#b8332a', '蜀');
camp(40, -40, '#2f5fa8', '魏');

// 里程碑战旗：沿中路从蜀到魏
const milestones = [
  ['2007', '三国争霸', '首作上线'], ['2008', '群雄逐鹿', '首创 10V10'], ['2011', '11对战平台', 'DotA 天梯'],
  ['2012', '巅峰', '同时在线 45万+'], ['2013', '三国争霸2', 'MOBA 续作'], ['2014', '冠军联赛', '总奖金 100万'], ['2026', '仍在运行', '二十年'],
];
const banners = [];
milestones.forEach(([y, t1, t2], i) => {
  const u = -32 + i * 10.5;                  // 沿中路的位置
  const side = i % 2 ? 1 : -1;
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.12, .15, 12, 6), new THREE.MeshStandardMaterial({ color: '#2b1d16' }));
  pole.position.y = 6; pole.castShadow = true; g.add(pole);
  const t = tex((c, w, h) => {
    const gr = c.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#b32a22'); gr.addColorStop(1, '#7a1712'); c.fillStyle = gr; c.fillRect(0, 0, w, h);
    c.strokeStyle = '#e9c27a'; c.lineWidth = 10; c.strokeRect(14, 14, w - 28, h - 28);
    c.fillStyle = '#ffe2a6'; c.textAlign = 'center';
    c.font = '900 150px "Noto Serif SC"'; c.fillText(y, w / 2, 200);
    c.fillStyle = '#fff6e6'; c.font = '900 92px "Noto Serif SC"'; c.fillText(t1, w / 2, 360);
    c.fillStyle = '#ffd38a'; c.font = '700 58px "Noto Sans SC"'; c.fillText(t2, w / 2, 470);
  }, 512, 560);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 5, 16, 1), new THREE.MeshStandardMaterial({ map: t, side: THREE.DoubleSide, roughness: .9 }));
  flag.position.set(2.4, 9, 0); flag.castShadow = true; g.add(flag);
  g.position.set(u - 3.2, 0, -u - 3.2);       // 统一立在中路一侧，竖屏里按纵深排开
  g.rotation.y = -Math.PI / 4;                 // 旗面朝向蜀营方向，也就是镜头来的方向
  scene.add(g); banners.push({ g, flag, i });
});

// 行军：一队红色兵卒（全片主角）
const troop = new THREE.Group();
for (let k = 0; k < 10; k++) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(.28, .9, 5), new THREE.MeshStandardMaterial({ color: '#e0443a', emissive: '#5a1008', flatShading: true }));
  m.position.set((k % 2) * .9 - .45, .6, Math.floor(k / 2) * .9); m.castShadow = true; troop.add(m);
}
scene.add(troop);

// 尘土/火星粒子
const pg = new THREE.BufferGeometry(); const pp = new Float32Array(900);
let sd = 9; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 300; i++) { pp[i * 3] = rnd() * 100 - 50; pp[i * 3 + 1] = rnd() * 20; pp[i * 3 + 2] = rnd() * 100 - 50; }
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
const embers = new THREE.Points(pg, new THREE.PointsMaterial({ color: '#ffc46b', size: .25, transparent: true, opacity: .8 }));
scene.add(embers);

const lane = u => new THREE.Vector3(u, 0, -u);
window.render = function (t) {
  // 一镜到底：镜头沿中路从蜀推向魏；预览固定在 2012 战旗附近
  const u = 0.5 + t * 1.2;
  // 侧后方高机位，略带俯视，战旗在画面左侧依次掠过
  camera.position.copy(lane(u - 12)).add(new THREE.Vector3(1.6, 7.5, 1.6));
  camera.lookAt(lane(u + 4).add(new THREE.Vector3(-2, 5.5, -2)));
  troop.position.copy(lane(u - 6)); troop.rotation.y = -Math.PI / 4;
  troop.children.forEach((m, k) => m.position.y = .6 + Math.abs(Math.sin(t * 8 + k)) * .15);
  banners.forEach(({ flag, i }) => {
    const p = flag.geometry.attributes.position;
    for (let j = 0; j < p.count; j++) { const x = p.getX(j); p.setZ(j, Math.sin(x * 1.3 + t * 4 + i) * .25 * (x + 2.3) / 4.6); }
    p.needsUpdate = true;
  });
  embers.rotation.y = t * .02; embers.position.y = (t * .6) % 2;
  renderer.render(scene, camera);
};
window.render(0);
window.ready = true;
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>方案A 宣纸长卷</title>
<link rel="stylesheet" href="../../../node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource/noto-serif-sc/700.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource/ma-shan-zheng/400.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource/zhi-mang-xing/400.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #e9dfc8; }
  #cv { position: absolute; inset: 0; }
  .t { position: absolute; }
  .title { left: 610px; top: 330px; writing-mode: vertical-rl; font: 400 230px/1 "Ma Shan Zheng"; color: #16110d; letter-spacing: -6px; }
  .note { left: 470px; top: 360px; writing-mode: vertical-rl; font: 700 40px/1.7 "Noto Serif SC"; color: #3a2f25; letter-spacing: 10px; }
  .note b { color: #a3241c; }
  .seal { left: 470px; top: 1060px; width: 120px; height: 150px; background: #b3261e; color: #f3e6cf; border-radius: 6px; font: 900 44px/1.05 "Noto Serif SC"; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(-3deg); box-shadow: inset 0 0 0 5px #b3261e, inset 0 0 0 8px #f3e6cf; }
  .year { left: 100px; top: 250px; writing-mode: vertical-rl; font: 900 64px/1 "Noto Serif SC"; letter-spacing: 14px; color: #b3261e; }
  .chap { left: 80px; top: 120px; font: 700 30px "Noto Serif SC"; color: #8b7a62; letter-spacing: 12px; }
  .foot { left: 100px; top: 760px; font: 700 34px/1.6 "Noto Serif SC"; color: #3a2f25; width: 360px; }
  .foot em { font-style: normal; color: #a3241c; }
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="t chap">卷二 · 盛</div>
<div class="t year">二〇〇八年</div>
<div class="t title">群雄逐鹿</div>
<div class="t note">十二月　<b>首创十对十</b><br>二十员武将　同图鏖战</div>
<div class="t seal">起凡<br>出品</div>
<div class="t foot">魏据东北，<br>蜀守西南，<br>一河横断，<br>三路<em>争锋</em>。</div>
<script>
const cv = document.getElementById('cv'), c = cv.getContext('2d');
let s = 5; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
const noise1 = (x, k) => { let v = 0, a = 1, f = 1; for (let o = 0; o < 5; o++) { v += a * Math.sin(x * f * 0.004 + k * 13.1 + o * 7.7) * Math.cos(x * f * 0.0027 + o * 3.3); a *= .5; f *= 2.1; } return v; };
window.render = function (t) {
  s = 5;
  const cam = t * 18; // 镜头沿卷轴缓慢下移
  c.fillStyle = '#ece2cb'; c.fillRect(0, 0, 1080, 1920);
  // 宣纸纤维
  for (let i = 0; i < 2600; i++) { const x = rnd() * 1080, y = rnd() * 1920, l = 4 + rnd() * 18, a = rnd() * 6.28;
    c.strokeStyle = `rgba(120,95,60,${.04 + rnd() * .06})`; c.lineWidth = .7; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
  // 远山：多层水墨
  for (let L = 0; L < 4; L++) {
    const base = 1000 + L * 170 - cam * (.3 + L * .15), amp = 220 - L * 30;
    const g = c.createLinearGradient(0, base - amp, 0, base + 400);
    const k = .10 + L * .14; g.addColorStop(0, `rgba(30,24,20,${k})`); g.addColorStop(.35, `rgba(30,24,20,${k * .55})`); g.addColorStop(1, 'rgba(30,24,20,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 1920);
    for (let x = 0; x <= 1080; x += 6) c.lineTo(x, base - Math.abs(noise1(x + L * 400, L)) * amp);
    c.lineTo(1080, 1920); c.fill();
  }
  // 两军：墨点笔触（左下蜀、右上魏）
  // 两军：旌旗阵列（左下蜀 · 朱旗，右上魏 · 墨旗）
  const army = (cx, cy, dir, flag) => { for (let i = 0; i < 10; i++) { const r = i % 5, q = Math.floor(i / 5);
    const x = cx + dir * (r * 46 + q * 30), y = cy - r * 26 + q * 70, h = 150 + (i * 37 % 40);
    c.strokeStyle = 'rgba(22,17,13,.9)'; c.lineWidth = 4; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - h); c.stroke();
    const wave = Math.sin(t * 3 + i) * 6;
    c.fillStyle = flag; c.beginPath(); c.moveTo(x, y - h); c.quadraticCurveTo(x + dir * 30, y - h + 6 + wave, x + dir * 62, y - h + 14 + wave);
    c.lineTo(x + dir * 54, y - h + 34); c.quadraticCurveTo(x + dir * 28, y - h + 30 + wave, x, y - h + 44); c.fill();
    c.fillStyle = 'rgba(22,17,13,.55)'; c.beginPath(); c.ellipse(x, y + 4, 16, 5, 0, 0, 7); c.fill(); } };
  army(110, 1500, 1, 'rgba(179,38,30,.92)');
  army(980, 1470, -1, 'rgba(22,17,13,.88)');
  // 一河横断：淡墨斜带
  c.save(); c.translate(540, 1350); c.rotate(-.35);
  const rg = c.createLinearGradient(0, -50, 0, 50); rg.addColorStop(0, 'rgba(60,80,95,0)'); rg.addColorStop(.5, 'rgba(60,80,95,.18)'); rg.addColorStop(1, 'rgba(60,80,95,0)');
  c.fillStyle = rg; c.fillRect(-900, -50, 1800, 100); c.restore();
  // 卷轴边缘与时间线红线
  c.fillStyle = 'rgba(80,55,30,.25)'; c.fillRect(0, 0, 26, 1920); c.fillRect(1054, 0, 26, 1920);
  c.strokeStyle = '#b3261e'; c.lineWidth = 3; c.beginPath(); c.moveTo(60, 0); c.lineTo(60, 1920); c.stroke();
  c.fillStyle = '#b3261e'; c.beginPath(); c.arc(60, 300, 12, 0, 7); c.fill();
  // 晕染暗角
  const v = c.createRadialGradient(540, 900, 500, 540, 900, 1200); v.addColorStop(0, 'rgba(90,60,30,0)'); v.addColorStop(1, 'rgba(90,60,30,.28)');
  c.fillStyle = v; c.fillRect(0, 0, 1080, 1920);
};
document.fonts.ready.then(() => { window.render(0); window.ready = true; });
window.ready = false;
</script></body></html>

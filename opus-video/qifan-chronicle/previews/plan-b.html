<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>方案B 像素网吧</title>
<link rel="stylesheet" href="../../../node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource/noto-sans-sc/900.css">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  #px, #tx { display: none; }
</style></head><body>
<canvas id="px" width="270" height="480"></canvas>
<canvas id="gl" width="1080" height="1920"></canvas>
<script>
const PW = 270, PH = 480;
const px = document.getElementById('px'), c = px.getContext('2d');
c.imageSmoothingEnabled = false;
const tx = document.createElement('canvas'); tx.width = PW; tx.height = PH; const tc = tx.getContext('2d', { willReadFrequently: true });

// 像素化文字：先正常画，再按 alpha 取阈值变硬边
function ptext(str, x, y, size, color, align = 'left', weight = 900) {
  tc.clearRect(0, 0, PW, PH);
  tc.font = `${weight} ${size}px "Noto Sans SC"`; tc.textAlign = align; tc.textBaseline = 'top';
  tc.fillStyle = '#fff'; tc.fillText(str, x, y);
  const m = tc.measureText(str), x0 = Math.max(0, Math.floor(align === 'center' ? x - m.width / 2 : x) - 2);
  const w = Math.min(PW - x0, Math.ceil(m.width) + 4), h = size + 6;
  const d = tc.getImageData(x0, y, w, h);
  c.fillStyle = color;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (d.data[(j * w + i) * 4 + 3] > 120) c.fillRect(x0 + i, y + j, 1, 1);
}
const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
let s = 3; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

function drawPixels(t) {
  s = 3;
  const f = Math.floor(t * 10) / 10; // 姿势按 10fps 量化
  R(0, 0, PW, PH, '#0b0a17');
  // 天花板灯管与霓虹招牌
  for (let i = 0; i < 3; i++) R(20 + i * 90, 10, 50, 3, `rgba(200,220,255,${.5 + .2 * Math.sin(f * 3 + i)})`);
  const neon = .75 + .25 * (Math.sin(f * 7) > -.6 ? 1 : 0);
  R(70, 26, 130, 30, '#1a0d1f');
  ptext('网吧 · 通宵', 135, 29, 20, `rgba(255,70,110,${neon})`, 'center');
  // 后排显示器剪影
  for (let i = 0; i < 5; i++) { R(4 + i * 56, 74, 46, 34, '#1b1930'); R(7 + i * 56, 77, 40, 26, `rgba(${60 + i * 20},${120 + i * 10},180,${.35 + .15 * Math.sin(f * 2 + i)})`); }
  // 主显示器外壳
  R(18, 118, 234, 192, '#c9c2ad'); R(22, 122, 226, 184, '#ddd6c0'); R(30, 128, 210, 160, '#111');
  R(115, 310, 40, 10, '#bdb6a1'); R(85, 320, 100, 8, '#a9a28e');
  R(220, 294, 6, 4, f % 1 < .5 ? '#3f3' : '#161'); // 电源灯
  // 屏幕里的游戏：俯视战场
  const sx = 34, sy = 132, sw = 202, sh = 152;
  R(sx, sy, sw, sh, '#2f5a2a');
  for (let i = 0; i < 90; i++) R(sx + rnd() * sw, sy + rnd() * sh, 2, 2, rnd() < .5 ? '#3a6b33' : '#264a22');
  for (let k = -4; k < 5; k++) for (let i = 0; i < 120; i++) { const u = i / 120; R(sx + u * sw + k, sy + u * sh, 2, 2, '#4f8fd0'); }  // 大河
  for (let i = 0; i < sw - 20; i += 2) { R(sx + 10 + i, sy + 10, 2, 3, '#c9a35a'); R(sx + 10 + i, sy + sh - 13, 2, 3, '#c9a35a'); }
  for (let j = 0; j < sh - 20; j += 2) { R(sx + 10, sy + 10 + j, 3, 2, '#c9a35a'); R(sx + sw - 13, sy + 10 + j, 3, 2, '#c9a35a'); }
  for (let i = 0; i < 60; i++) { const u = i / 60; R(sx + 12 + u * (sw - 24), sy + sh - 12 - u * (sh - 24), 3, 3, '#c9a35a'); }
  R(sx + 4, sy + sh - 22, 18, 18, '#d33'); R(sx + sw - 22, sy + 4, 18, 18, '#36c');  // 两营
  const p = (f * .12) % 1;
  for (let k = 0; k < 5; k++) { const u = .22 + p * .25 + k * .025; R(sx + 12 + u * (sw - 24) - 6, sy + sh - 12 - u * (sh - 24) + k * 2, 4, 4, '#ff5b4f'); }
  for (let k = 0; k < 5; k++) { const u = .78 - p * .25 - k * .025; R(sx + 12 + u * (sw - 24) + 2, sy + sh - 12 - u * (sh - 24) - k * 2, 4, 4, '#6fb7ff'); }
  if ((f * 10) % 6 < 3) R(sx + sw / 2 - 3, sy + sh / 2 - 3, 6, 6, '#fff6c0'); // 交战闪光
  R(sx, sy + sh - 12, sw, 12, 'rgba(0,0,0,.6)'); ptext('5V5', sx + 4, sy + sh - 12, 10, '#ffd36b', 'left', 700);
  // 桌面：键盘、泡面
  R(0, 330, PW, 6, '#2a2238'); R(40, 338, 160, 16, '#3a3550'); for (let i = 0; i < 14; i++) R(46 + i * 11, 341, 8, 4, '#59537a');
  R(214, 326, 34, 22, '#e8e0cc'); R(214, 326, 34, 5, '#d23b2a'); R(222, 312 - (f * 20 % 12), 2, 8, 'rgba(255,255,255,.35)');
  // 年份与标题（像素字）
  ptext('2007', 135, 360, 50, '#ffcf4a', 'center');
  ptext('《三国争霸》上线', 135, 414, 22, '#f2ead6', 'center');
  ptext('蜀魏对垒 · 最高在线 20 万', 135, 444, 16, '#b4bce0', 'center', 900);
}

// ---------- WebGL CRT ----------
const gl = document.getElementById('gl').getContext('webgl2', { preserveDrawingBuffer: true });
const vs = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0, 1); }`;
const fs = `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform sampler2D tex; uniform float t; uniform vec2 res;
vec2 curve(vec2 u){ u = u * 2. - 1.; vec2 off = abs(u.yx) / vec2(7., 5.); u += u * off * off; return u * .5 + .5; }
vec3 samp(vec2 u){ return texture(tex, u).rgb; }
void main(){
  vec2 u = curve(uv);
  if (u.x < 0. || u.x > 1. || u.y < 0. || u.y > 1.) { o = vec4(0, 0, 0, 1); return; }
  float ca = .0012;
  vec3 col = vec3(samp(u + vec2(ca, 0)).r, samp(u).g, samp(u - vec2(ca, 0)).b);
  vec3 glow = vec3(0); for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) glow += samp(u + vec2(float(i), float(j)) * .004);
  col += glow / 49. * .55;
  float sl = .78 + .22 * sin(u.y * 480. * 3.14159 * 2.);
  col *= sl;
  float m = mod(gl_FragCoord.x, 3.);
  col *= m < 1. ? vec3(1.08, .92, .92) : m < 2. ? vec3(.92, 1.08, .92) : vec3(.92, .92, 1.08);
  col *= 1. + .04 * sin(t * 50. + u.y * 8.);
  vec2 v = u * (1. - u.yx); col *= pow(v.x * v.y * 15., .28);
  o = vec4(col * 1.12, 1);
}`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const texo = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texo);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

window.ready = false;
window.render = function (t) {
  drawPixels(t);
  gl.viewport(0, 0, 1080, 1920);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.uniform1f(gl.getUniformLocation(prog, 't'), t);
  gl.uniform2f(gl.getUniformLocation(prog, 'res'), 1080, 1920);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish();
};
document.fonts.load('900 20px "Noto Sans SC"', '起凡网吧2007《三国争霸》上线蜀魏对垒最高在线万').then(() => document.fonts.ready).then(() => { window.render(0); window.ready = true; });
</script></body></html>
